<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kunal ki Choodi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Poppins:wght@400;500;600;700&display=swap');

  :root{
    --bg-deep: #180B2E;
    --bg-deep-2: #2A1450;
    --magenta: #FF2E88;
    --gold: #FFC53D;
    --cream: #FDF3E7;
    --violet-line: #7C4DFF;
    --teal: #2FE6C4;
    --shadow-ink: #0D0620;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 0%, var(--bg-deep-2) 0%, var(--bg-deep) 55%, #0F0722 100%);
    color: var(--cream);
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---------- Background bindi/bangle pattern ---------- */
  .bg-pattern{
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle, rgba(255,197,61,0.10) 1.5px, transparent 1.6px);
    background-size: 38px 38px;
    pointer-events:none;
    opacity:0.7;
  }

  /* ---------- Header ---------- */
  .header{
    position:relative;
    z-index: 5;
    text-align:center;
    padding: 18px 16px 6px;
    width:100%;
  }

  .title{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(28px, 6vw, 46px);
    letter-spacing: 0.5px;
    margin:0;
    color: var(--gold);
    text-shadow: 0 3px 0 var(--shadow-ink), 0 0 24px rgba(255,197,61,0.35);
  }
  .title .hi{
    color: var(--magenta);
    text-shadow: 0 3px 0 var(--shadow-ink), 0 0 24px rgba(255,46,136,0.4);
  }

  .subtitle{
    font-size: 12.5px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(253,243,231,0.55);
    margin-top: 2px;
    font-weight: 600;
  }

  .counter-wrap{
    margin-top: 10px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }

  .counter{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: clamp(38px, 10vw, 64px);
    line-height:1;
    color: var(--cream);
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .counter .num{
    font-variant-numeric: tabular-nums;
    min-width: 1ch;
    transition: transform 0.08s ease-out;
  }
  .counter .label{
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size: 14px;
    color: var(--teal);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .counter.bump .num{ transform: scale(1.12); }

  .cps-row{
    font-size: 12px;
    color: rgba(253,243,231,0.5);
    font-weight:500;
    height: 16px;
  }
  .cps-row b{ color: var(--gold); font-weight:700; }

  /* ---------- Click zone ---------- */
  .click-zone{
    position: relative;
    flex: 1;
    width: 100%;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 3;
  }

  .photo-ring{
    position: relative;
    width: min(52vw, 320px);
    height: min(52vw, 320px);
  }

  .photo-ring::before{
    content:"";
    position:absolute;
    inset: -14px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--magenta), var(--gold), var(--teal), var(--violet-line), var(--magenta));
    animation: spin 7s linear infinite;
    filter: blur(1px);
    opacity: 0.85;
  }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .photo-btn{
    position:absolute;
    inset: 6px;
    border-radius: 50%;
    border: 6px solid var(--bg-deep);
    background-size: cover;
    background-position: center;
    cursor: pointer;
    box-shadow:
      0 14px 30px rgba(0,0,0,0.45),
      inset 0 0 0 3px rgba(255,255,255,0.06);
    transition: transform 0.06s ease-out;
    z-index: 2;
  }
  .photo-btn:active{ transform: scale(0.94); }
  .photo-btn.pulse{ animation: pulse 0.16s ease-out; }
  @keyframes pulse{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.06); }
    100%{ transform: scale(1); }
  }

  .tap-hint{
    position:absolute;
    bottom: -34px;
    left:50%;
    transform: translateX(-50%);
    font-size: 11.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(253,243,231,0.45);
    font-weight:600;
    white-space:nowrap;
  }

  /* ---------- Skyline: purchased buildings shown behind the photo ---------- */
  .skyline{
    position: absolute;
    left: 6px;
    right: 6px;
    bottom: 6px;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    max-height: 46%;
    overflow: hidden;
    pointer-events: none;
  }

  .bldg{
    width: 34px;
    height: 42px;
    flex-shrink: 0;
    animation: buildingPop 0.4s ease-out;
  }
  .bldg svg{ width: 100%; height: 100%; overflow: visible; display: block; }

  .bldg-extra{
    align-self: flex-end;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px;
    padding: 4px 10px;
    margin-bottom: 6px;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
    font-family: 'Baloo 2', sans-serif;
  }

  @keyframes buildingPop{
    0%{ transform: scale(0.3); opacity: 0; }
    65%{ transform: scale(1.18); opacity: 1; }
    100%{ transform: scale(1); opacity: 1; }
  }

  /* ambient building animations — purely CSS, always running once present */
  .smoke-puff{
    animation: smokeRise 2.6s ease-out infinite;
    transform-origin: center;
  }
  .smoke-puff:nth-child(2){ animation-delay: 0.9s; }
  .smoke-puff:nth-child(3){ animation-delay: 1.7s; }
  @keyframes smokeRise{
    0%{ transform: translateY(0) scale(0.6); opacity: 0; }
    15%{ opacity: 0.75; }
    100%{ transform: translateY(-16px) scale(1.4); opacity: 0; }
  }

  .sign-sway{
    animation: signSway 2.2s ease-in-out infinite;
    transform-origin: 22px 12px;
  }
  @keyframes signSway{
    0%,100%{ transform: rotate(-5deg); }
    50%{ transform: rotate(5deg); }
  }

  .blink-light{ animation: blinkLight 1.6s steps(1) infinite; }
  @keyframes blinkLight{
    0%,49%{ opacity: 1; }
    50%,100%{ opacity: 0.25; }
  }

  .march-figure{ animation: marchBounce 0.9s ease-in-out infinite; transform-origin: bottom center; }
  .march-figure:nth-child(2){ animation-delay: 0.15s; }
  .march-figure:nth-child(3){ animation-delay: 0.3s; }
  @keyframes marchBounce{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-3px); }
  }

  @media (prefers-reduced-motion: reduce){
    .smoke-puff, .sign-sway, .blink-light, .march-figure{ animation: none; }
  }

  /* ---------- Floating photos / click text: see .fx-layer rules below ---------- */
  @keyframes shake{
    0%, 100%{ transform: translate(0,0); }
    20%{ transform: translate(-6px,3px); }
    40%{ transform: translate(6px,-3px); }
    60%{ transform: translate(-4px,-2px); }
    80%{ transform: translate(4px,2px); }
  }
  .stage.shake{ animation: shake 0.35s ease-in-out; }

  /* ---------- Progress bar ---------- */
  .progress-shell{
    position: relative;
    z-index: 5;
    width: min(560px, 92%);
    margin: 0 auto 22px;
  }

  .milestone-caption{
    text-align:center;
    font-size: 12px;
    color: rgba(253,243,231,0.55);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.4px;
  }
  .milestone-caption b{ color: var(--teal); font-weight:700; }

  .progress-track{
    position: relative;
    width: 100%;
    height: 20px;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
    border: 2px solid rgba(255,255,255,0.14);
    overflow: visible;
  }

  .progress-fill{
    position:absolute;
    top:0; left:0; bottom:0;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--violet-line), var(--magenta) 55%, var(--gold));
    box-shadow: 0 0 14px rgba(255,46,136,0.55);
    transition: width 0.35s cubic-bezier(.3,1,.4,1);
  }

  .milestone-marker{
    position:absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: var(--bg-deep);
    border: 3px solid var(--violet-line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 10px;
    font-weight: 800;
    font-family:'Baloo 2', sans-serif;
    color: rgba(253,243,231,0.75);
    transition: border-color 0.3s, color 0.3s, background 0.3s, box-shadow 0.3s;
  }
  .milestone-marker.done{
    border-color: var(--gold);
    background: var(--gold);
    color: var(--shadow-ink);
    box-shadow: 0 0 12px rgba(255,197,61,0.7);
  }

  /* ---------- Achievement toast ---------- */
  .achievement{
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%) translateY(-140%);
    z-index: 20;
    background: linear-gradient(135deg, #2A1450, #180B2E);
    border: 2px solid var(--gold);
    border-radius: 16px;
    padding: 14px 20px;
    display:flex;
    align-items:center;
    gap: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 24px rgba(255,197,61,0.25);
    transition: transform 0.45s cubic-bezier(.2,1.3,.4,1);
    max-width: 90vw;
  }
  .achievement.show{ transform: translateX(-50%) translateY(0); }

  .achievement .ach-photo{
    width: 44px; height: 44px;
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 2px solid var(--gold);
    flex-shrink:0;
  }
  .achievement .ach-text{ display:flex; flex-direction:column; }
  .achievement .ach-title{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 14px;
    color: var(--gold);
    letter-spacing:0.3px;
  }
  .achievement .ach-sub{
    font-size: 11.5px;
    color: rgba(253,243,231,0.7);
    font-weight:500;
  }

  /* ---------- Reset button ---------- */
  .reset-btn{
    position: fixed;
    top: 14px;
    right: 14px;
    z-index: 6;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18);
    color: rgba(253,243,231,0.6);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
  .reset-btn:hover{ background: rgba(255,255,255,0.14); color: var(--cream); }

  .mute-btn{
    position: fixed;
    top: 14px;
    right: 78px;
    z-index: 6;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18);
    color: rgba(253,243,231,0.75);
    font-size: 15px;
    padding: 6px 11px;
    border-radius: 999px;
    cursor: pointer;
    line-height: 1;
  }
  .mute-btn:hover{ background: rgba(255,255,255,0.14); }

  .shop-btn{
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 6;
    background: rgba(255,255,255,0.08);
    border: 1.5px solid rgba(255,255,255,0.18);
    color: rgba(253,243,231,0.85);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 7px 13px;
    border-radius: 999px;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
  }
  .shop-btn:hover{ background: rgba(255,255,255,0.14); }

  /* ---------- Shop (bottom sheet) ---------- */
  .shop-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(5,2,15,0.6);
    z-index: 29;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .shop-backdrop.open{ opacity: 1; pointer-events: auto; }

  .shop-panel{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 30;
    background: linear-gradient(180deg, #2A1450, #150A28 65%);
    border-top: 3px solid var(--gold);
    border-radius: 22px 22px 0 0;
    max-height: 74vh;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(.25,1,.4,1);
    box-shadow: 0 -12px 40px rgba(0,0,0,0.55);
  }
  .shop-panel.open{ transform: translateY(0); }

  .shop-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 10px;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--gold);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .shop-header .shop-balance{
    font-size: 12px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    color: rgba(253,243,231,0.6);
    margin-left: 8px;
  }
  .shop-close{
    background: none;
    border: none;
    color: rgba(253,243,231,0.7);
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    padding: 4px 8px;
  }

  .shop-list{
    overflow-y: auto;
    padding: 12px 14px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .shop-item{
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .shop-item .s-icon{
    font-size: 26px;
    width: 38px;
    text-align: center;
    flex-shrink: 0;
  }
  .shop-item .s-info{ flex: 1; min-width: 0; }
  .shop-item .s-name{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--cream);
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .shop-item .s-owned{
    font-size: 11px;
    color: var(--teal);
    font-weight: 700;
  }
  .shop-item .s-desc{
    font-size: 11px;
    color: rgba(253,243,231,0.55);
    margin-top: 2px;
  }
  .shop-item .s-buy{
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    background: linear-gradient(135deg, var(--magenta), var(--violet-line));
    border: none;
    border-radius: 12px;
    padding: 8px 12px;
    color: var(--cream);
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    min-width: 64px;
  }
  .shop-item .s-buy .s-cost{ font-size: 11px; }
  .shop-item .s-buy:disabled{
    background: rgba(255,255,255,0.08);
    color: rgba(253,243,231,0.35);
    cursor: not-allowed;
  }

  /* ---------- Chhed (too-fast reset) toast ---------- */
  .chhed-toast{
    position: fixed;
    top: 38%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    z-index: 35;
    background: linear-gradient(135deg, #4a0f1f, #200608);
    border: 3px solid #ff4d4d;
    border-radius: 18px;
    padding: 18px 26px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 30px rgba(255,60,60,0.5);
    max-width: 86vw;
  }
  .chhed-toast.show{
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .chhed-title{
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 21px;
    color: #ff5c5c;
    text-shadow: 0 2px 0 #200608;
  }
  .chhed-sub{
    font-size: 12px;
    color: rgba(253,243,231,0.75);
    margin-top: 5px;
    font-weight: 500;
  }

  /* ---------- FX overlay: all click effects render here, fixed to viewport ---------- */
  .fx-layer{
    position: fixed;
    inset: 0;
    z-index: 15;
    pointer-events: none;
    overflow: hidden;
  }
  .fx-layer .float-photo,
  .fx-layer .click-text,
  .fx-layer .ripple,
  .fx-layer .spark{
    position: absolute;
    top: 0;
    left: 0;
    will-change: transform, opacity;
  }
  .fx-layer .float-photo{
    border-radius: 50%;
    background-size: cover;
    background-position: center;
    border: 2px solid rgba(255,255,255,0.55);
    box-shadow: 0 6px 14px rgba(0,0,0,0.35);
  }
  .fx-layer .click-text{
    font-family:'Baloo 2', sans-serif;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 2px 0 var(--shadow-ink);
    white-space: nowrap;
    transform: translate(-50%, 0);
  }
  .fx-layer .ripple{
    border-radius: 50%;
    border: 4px solid var(--gold);
    transform: translate(-50%, -50%);
  }
  .fx-layer .spark{
    border-radius: 50%;
  }

  /* combo glow intensifies the ring at high click speed */
  .photo-ring.combo-1::before{ filter: blur(2px) brightness(1.15); }
  .photo-ring.combo-2::before{ filter: blur(3px) brightness(1.35); animation-duration: 4.5s; }
  .photo-ring.combo-3::before{ filter: blur(4px) brightness(1.6); animation-duration: 2.4s; }

  @media (prefers-reduced-motion: reduce){
    .photo-ring::before{ animation-duration: 20s; }
    .stage.shake{ animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg-pattern"></div>
  <button class="shop-btn" id="shopBtn">🏗️ Shop</button>
  <button class="mute-btn" id="muteBtn" title="Toggle sound">🔊</button>
  <button class="reset-btn" id="resetBtn">Reset</button>

  <div class="header">
    <h1 class="title">Kunal ki <span class="hi">Choodi</span></h1>
    <div class="subtitle">the official hostel-room clicker</div>
    <div class="counter-wrap">
      <div class="counter"><span class="num" id="countNum">0</span><span class="label">choodiyan</span></div>
      <div class="cps-row" id="cpsRow">&nbsp;</div>
    </div>
  </div>

  <div class="click-zone" id="clickZone">
    <div class="skyline" id="skyline"></div>
    <div class="photo-ring" id="photoRing">
      <div class="photo-btn" id="photoBtn"></div>
      <div class="tap-hint">tap kunal</div>
    </div>
  </div>

  <div class="progress-shell">
    <div class="milestone-caption" id="milestoneCaption">next milestone: <b>100</b></div>
    <div class="progress-track" id="progressTrack">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>
</div>

<div class="fx-layer" id="fxLayer"></div>

<div class="achievement" id="achievement">
  <div class="ach-photo" id="achPhoto"></div>
  <div class="ach-text">
    <div class="ach-title" id="achTitle">Milestone!</div>
    <div class="ach-sub" id="achSub">100 choodiyan tod di</div>
  </div>
</div>

<div class="chhed-toast" id="chhedToast">
  <div class="chhed-title">Choodi me chhed hogya!</div>
  <div class="chhed-sub">itni jaldi mat karo yaar, sab reset ho gaya</div>
</div>

<div class="shop-backdrop" id="shopBackdrop"></div>
<div class="shop-panel" id="shopPanel">
  <div class="shop-header">
    <div>Choodi Bazaar<span class="shop-balance" id="shopBalance"></span></div>
    <button class="shop-close" id="shopClose">✕</button>
  </div>
  <div class="shop-list" id="shopList"></div>
</div>

let audioCtx = null;
let muted = false;

function ensureAudio(){
  if (!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return null;
    audioCtx = new Ctx();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(ctx, {freq, start, dur, type='triangle', peak=0.2, freqEnd=null}){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, start);
  if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, start + dur);
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(peak, start + Math.min(0.012, dur*0.2));
  gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  osc.connect(gain).connect(ctx.destination);
  osc.start(start);
  osc.stop(start + dur + 0.02);
}

function playClickSound(comboLevel){
  if (muted) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  const jitter = (Math.random() - 0.5) * 120;
  const base = 1500 + jitter + comboLevel * 90;
  // bright bangle-like clink: bright partial + shimmer overtone
  tone(ctx, {freq: base, start: now, dur: 0.09, type: 'triangle', peak: 0.16, freqEnd: base * 0.62});
  tone(ctx, {freq: base * 2.35, start: now, dur: 0.07, type: 'sine', peak: 0.05, freqEnd: base * 1.6});
}

function playMilestoneSound(){
  if (muted) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((freq, i) => {
    tone(ctx, {freq, start: now + i * 0.1, dur: 0.32, type: 'triangle', peak: 0.2});
    tone(ctx, {freq: freq * 2, start: now + i * 0.1, dur: 0.24, type: 'sine', peak: 0.06});
  });
}

function playBuySound(){
  if (muted) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  tone(ctx, {freq: 660, start: now, dur: 0.12, type: 'sine', peak: 0.18, freqEnd: 880});
  tone(ctx, {freq: 990, start: now + 0.06, dur: 0.14, type: 'triangle', peak: 0.14});
}

function playChhedSound(){
  if (muted) return;
  const ctx = ensureAudio();
  if (!ctx) return;
  const now = ctx.currentTime;
  tone(ctx, {freq: 320, start: now, dur: 0.28, type: 'sawtooth', peak: 0.22, freqEnd: 55});
  const bufferSize = Math.floor(ctx.sampleRate * 0.22);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++){
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.3, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
  noise.connect(noiseGain).connect(ctx.destination);
  noise.start(now);
}

function updateCps(){

    return;
  }
  const span = (clickTimes[clickTimes.length-1] - clickTimes[0]) / 1000;
  const cps = span > 0 ? (clickTimes.length / span) : 0;
  const ratio = cps / stats.safeLimit;
  let color = 'var(--teal)';
  if (ratio > 0.85) color = '#ff5c5c';
  else if (ratio > 0.6) color = 'var(--gold)';
  cpsRow.innerHTML = `<b style="color:${color}">${cps.toFixed(1)}</b> / ${stats.safeLimit.toFixed(1)} cps`;
}

/* All click effects render into #fxLayer, a fixed full-viewport overlay,
   and are driven by a manual requestAnimationFrame loop rather than CSS
   keyframes or the Web Animations API — this sidesteps any host-environment
   quirks with animation timing and guarantees the effect actually paints. */

const fxLayer = document.getElementById('fxLayer');

function runAnimation(el, duration, onFrame, onDone){
  const start = performance.now();
  function step(now){
    let t = (now - start) / duration;
    if (t > 1) t = 1;
    onFrame(t, el);
    if (t < 1){
      requestAnimationFrame(step);
    } else {
      el.remove();
      if (onDone) onDone();
    }
  }
  requestAnimationFrame(step);
}

function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

function spawnFloatPhoto(originRect){
  const size = 28 + Math.random() * 34;
  const el = document.createElement('div');
  el.className = 'float-photo';

  const pick = IMAGE_ORDER[Math.floor(Math.random() * IMAGE_ORDER.length)];
  el.style.backgroundImage = `url(${imgUrl(pick)})`;
  el.style.width = size + 'px';
  el.style.height = size + 'px';

  const startX = originRect.left + originRect.width/2 + (Math.random() * 150 - 75) - size/2;
  const startY = originRect.top + originRect.height/2 + (Math.random() * 60 - 30) - size/2;
  el.style.transform = `translate(${startX}px, ${startY}px)`;
  el.style.opacity = '0';

  fxLayer.appendChild(el);

  const riseY = -(240 + Math.random() * 300);
  const driftX = (Math.random() * 160 - 80);
  const rotMax = (Math.random() * 80 - 40);
  const duration = 1500 + Math.random() * 1200;

  runAnimation(el, duration, (t) => {
    const e = easeOutCubic(t);
    const x = startX + driftX * e;
    const y = startY + riseY * e;
    const rot = rotMax * e;
    const scale = 0.6 + 0.4 * Math.min(t / 0.15, 1);
    let opacity;
    if (t < 0.12) opacity = t / 0.12;
    else if (t > 0.75) opacity = Math.max(0, (1 - t) / 0.25);
    else opacity = 1;
    el.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg) scale(${scale})`;
    el.style.opacity = opacity;
  });
}

const CLICK_PHRASES = [
  "Bhai diyo", "tune pink pehna hai", "maal pada hai kya",
  "patpat", "bade bhai yaar", "lapdog", "sin city"
];

function spawnClickText(originRect){
  const el = document.createElement('div');
  el.className = 'click-text';
  el.textContent = CLICK_PHRASES[Math.floor(Math.random() * CLICK_PHRASES.length)];
  el.style.fontSize = (13 + Math.random() * 5) + 'px';

  const startX = originRect.left + originRect.width/2 + (Math.random() * 70 - 35);
  const startY = originRect.top + 4;
  el.style.opacity = '0';
  fxLayer.appendChild(el);

  const duration = 950;
  runAnimation(el, duration, (t) => {
    const y = -78 * easeOutCubic(t);
    const scale = 0.8 + 0.35 * Math.min(t / 0.25, 1) - (t > 0.25 ? 0.1 * ((t-0.25)/0.75) : 0);
    let opacity;
    if (t < 0.15) opacity = t / 0.15;
    else if (t > 0.7) opacity = Math.max(0, (1 - t) / 0.3);
    else opacity = 1;
    el.style.transform = `translate(-50%, 0) translateY(${startY + y}px) scale(${scale})`;
    el.style.left = startX + 'px';
    el.style.top = '0px';
    el.style.opacity = opacity;
  });
}

function spawnRipple(originRect){
  const el = document.createElement('div');
  el.className = 'ripple';
  const cx = originRect.left + originRect.width/2;
  const cy = originRect.top + originRect.height/2;
  el.style.left = cx + 'px';
  el.style.top = cy + 'px';
  fxLayer.appendChild(el);

  const maxSize = originRect.width * 1.35;
  const duration = 480;
  runAnimation(el, duration, (t) => {
    const e = easeOutCubic(t);
    const size = 10 + (maxSize - 10) * e;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.borderWidth = (4 - 3 * e) + 'px';
    el.style.opacity = 0.9 * (1 - e);
  });
}

const SPARK_COLORS = ['#FFC53D', '#FF2E88', '#2FE6C4', '#7C4DFF'];

function spawnSparks(originRect, amount){
  const cx = originRect.left + originRect.width/2;
  const cy = originRect.top + originRect.height/2;
  for (let i = 0; i < amount; i++){
    const el = document.createElement('div');
    el.className = 'spark';
    const size = 4 + Math.random() * 5;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.background = SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)];
    fxLayer.appendChild(el);

    const angle = Math.random() * Math.PI * 2;
    const dist = 40 + Math.random() * 100;
    const dx = Math.cos(angle) * dist;
    const dy = Math.sin(angle) * dist - 20;
    const duration = 450 + Math.random() * 350;

    runAnimation(el, duration, (t) => {
      const e = easeOutCubic(t);
      const x = cx + dx * e - size/2;
      const y = cy + dy * e - size/2;
      const scale = 1 - 0.7 * e;
      el.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      el.style.opacity = 1 - e;
    });
  }
}

function handleClick(e){
  clickTimes.push(performance.now());
  const cps = currentCps();

  // click too fast for your current safe limit -> "Choodi me chhed hogya"
  if (clickTimes.length >= 4 && cps > stats.safeLimit){
    triggerChhed();
    return;
  }

  count += stats.clickValue;

  updateCounter();
  updateCps();
  updateProgress();
  renderShopList();
  checkMilestones();

  updateComboVisual(cps);

  const rect = photoBtn.getBoundingClientRect();

  playClickSound(Math.min(cps, 10));
  spawnRipple(rect);
  spawnFloatPhoto(rect);
  spawnClickText(rect);
  spawnSparks(rect, 3 + Math.min(Math.floor(cps), 6));

  // the faster you click, the more photos join the background
  const extraChance = Math.min(cps / 6, 1);
  if (Math.random() < extraChance) spawnFloatPhoto(rect);
  if (cps > 6 && Math.random() < 0.5) spawnFloatPhoto(rect);

  photoBtn.classList.remove('pulse');
  void photoBtn.offsetWidth;
  photoBtn.classList.add('pulse');

  scheduleSave();
}

photoBtn.addEventListener('pointerdown', handleClick);

/* ---------- Save / load (localStorage — works once hosted on a real
   domain like GitHub Pages; safely no-ops if storage is unavailable,
   e.g. private browsing or the Claude.ai artifact preview sandbox) ---------- */
const SAVE_KEY = 'kunalKiChoodiSave_v1';
let saveTimer = null;

function saveState(){
  try{
    const data = {
      count,
      currentImageIndex,
      achieved: Array.from(achievedSet),
      owned
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch(e){ /* storage unavailable — fail silently, game still works in-memory */ }
}

function scheduleSave(){
  if (saveTimer) return;
  saveTimer = setTimeout(() => {
    saveTimer = null;
    saveState();
  }, 800);
}

function loadState(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    count = typeof data.count === 'number' ? data.count : 0;
    currentImageIndex = data.currentImageIndex || 0;
    achievedSet = new Set(data.achieved || []);
    owned = Object.assign({ factory: 0, kurta: 0, bookshop: 0, army: 0 }, data.owned || {});
    return true;
  } catch(e){
    return false;
  }
}

window.addEventListener('beforeunload', saveState);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveState();
});

});

loadState();
recalcStats();
setPhoto(IMAGE_ORDER[currentImageIndex]);
updateCounter();
updateProgress();
updateCps();
renderSkyline();
renderShopList();
document.querySelectorAll('.milestone-marker').forEach(m => {
  const id = parseInt(m.id.replace('marker-',''));
  if (count >= id) m.classList.add('done');
});
</script>
